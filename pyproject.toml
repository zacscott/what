[project]
name = "what"
version = "0.1.0"
description = "Searches a git repository by symbol and text from the command line, deleted files included"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Zac Scott" }]
keywords = ["code-search", "git", "tree-sitter", "sqlite", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.5.1",
    "google-re2>=1.1.20251105",
    "pathspec>=1.1.1",
    "tree-sitter>=0.27.0",
    "tree-sitter-language-pack>=1.25.2",
]

[project.scripts]
what = "what.cli:main"

[project.urls]
Homepage = "https://github.com/zacscott/what"
Repository = "https://github.com/zacscott/what"
Issues = "https://github.com/zacscott/what/issues"
Changelog = "https://github.com/zacscott/what/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
